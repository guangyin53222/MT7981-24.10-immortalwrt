name: MT7981 ImmortalWrt 24.10 Builder

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 调试 (true/false)'
        required: false
        default: 'false'
      upload_artifact:
        description: '上传 Artifact (true/false)'
        required: false
        default: 'true'
      upload_release:
        description: '上传 Release (true/false)'
        required: false
        default: 'true'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: mt7981-24.10-6.6.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_RELEASE: ${{ github.event.inputs.upload_release || 'true' }}
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 清理磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: 安装编译依赖
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
          ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev \
          gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
          libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp ninja-build \
          p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
          python3-docutils python3-pyelftools qemu-utils re2c rsync scons \
          squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim \
          wget xmlto xxd zlib1g-dev zstd
        sudo apt-get clean

    - name: 克隆源码
      run: |
        git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        echo "OPENWRT_ROOT=$PWD" >> $GITHUB_ENV

    - name: 加载自定义 feeds (diy-part1.sh)
      run: |
        cd openwrt
        chmod +x ../$DIY_P1_SH
        cp ../$DIY_P1_SH ./diy-part1.sh
        ./diy-part1.sh

    - name: Update & Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载 .config
      run: |
        cd openwrt
        cp ../$CONFIG_FILE .config
        make defconfig

    - name: 应用 diy-part2.sh
      run: |
        cd openwrt
        chmod +x ../$DIY_P2_SH
        cp ../$DIY_P2_SH ./diy-part2.sh
        ./diy-part2.sh

    - name: SSH 调试 (手动触发)
      if: github.event.inputs.ssh == 'true'
      uses: P3TERX/ssh2actions@main
      with:
        ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 下载源码包
      run: |
        cd openwrt
        make download -j$(nproc) V=s

    - name: 编译固件
      run: |
        cd openwrt
        echo -e "$(nproc) 线程编译开始..."
        make -j$(nproc) V=s 2>&1 | tee build.log
        echo "::set-output name=status::success"

    - name: 整理固件文件
      id: organize
      run: |
        cd openwrt
        mkdir -p ../firmware
        # 查找所有固件文件
        find bin/targets/ -type f \( -name "*.bin" -o -name "*.itb" -o -name "*.img.gz" -o -name "*.tar.gz" \) -exec cp {} ../firmware/ \;
        # 也复制 ipks
        mkdir -p ../packages
        find bin/targets/ -type f -name "*.ipk" -exec cp {} ../packages/ \;
        echo "DEVICE=$(ls firmware/ | head -1)" >> $GITHUB_OUTPUT
        echo "DATE=$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT

    - name: 上传 Artifact
      if: github.event.inputs.upload_artifact != 'false'
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_firmware_${{ steps.organize.outputs.DATE }}
        path: firmware/
        retention-days: 30

    - name: 创建 Release
      if: env.UPLOAD_RELEASE == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: firmware/*
        tag_name: ${{ steps.organize.outputs.DATE }}
        name: ImmortalWrt ${{ steps.organize.outputs.DATE }}
        body: |
          🔧 MT7981 ImmortalWrt 24.10 自动编译固件
          - 内核: Linux 6.6
          - 驱动: MTK 闭源 WiFi
          - 机型: RAX3000M-stock / JCG Q30 Pro / 360T7
          - 编译时间: ${{ steps.organize.outputs.DATE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 清理旧 Workflow 记录
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 3

    # ⚠️ 以下"清理旧 Release"步骤已删除
    # 原因: dev-drpr/delete-older-releases 仓库已失效
    #       导致 Set up job 阶段直接报错退出
    # 如需手动清理旧 Release，请到 GitHub 仓库页面操作
